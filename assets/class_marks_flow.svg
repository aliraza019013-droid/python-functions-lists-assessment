<text x="492" y="601" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">No</text>
<polyline points="640,585 640,505 460,505" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="312" y="665" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">Yes</text>
<rect x="130.0" y="689.0" width="340" height="52" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="300" y="711.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle">student_names.append(name)</text>
<text x="300" y="726.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle">student_marks.append(mark)</text>
<polyline points="300,656 300,689" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
