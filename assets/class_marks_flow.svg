<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1250" width="860" height="1250" role="img" aria-label="Flow chart: Class Marks Analyzer">
<title>Flow chart: Class Marks Analyzer</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
