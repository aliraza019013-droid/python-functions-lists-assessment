<text x="300" y="302.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle">student_names = [ ]   student_marks = [ ]</text>
<polyline points="300,247 300,276" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
