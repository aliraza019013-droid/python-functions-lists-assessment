<text x="300" y="406.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle">for number in range(1, count+1)</text>
<polyline points="300,320 300,350" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="312" y="447" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">Yes</text>
