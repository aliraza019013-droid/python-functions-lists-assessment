<text x="492" y="1041" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">No</text>
<text x="312" y="1100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">Yes</text>
<rect x="90.0" y="1124.0" width="420" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
