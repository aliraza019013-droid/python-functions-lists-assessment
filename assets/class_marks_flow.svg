<text x="60" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke">next student</text>
<rect x="90.0" y="792.0" width="420" height="76" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="300" y="818.8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle">average = sum / len</text>
<text x="300" y="834.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle">highest = max(…) · lowest = min(…)</text>
<text x="300" y="849.6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="middle">ranked_marks = sorted(…, reverse=True)</text>
<polyline points="460,395 815,395 815,830 510,830" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="640" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">No (all students read)</text>
<rect x="90.0" y="914.0" width="420" height="62" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
