<text x="640" y="90" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" xml:space="preserve"><tspan fill="#c084fc">for </tspan><tspan fill="#e2e8f0">minimum, grade </tspan><tspan fill="#c084fc">in </tspan><tspan fill="#e2e8f0">GRADE_SCALE:</tspan></text>
<text x="640" y="111" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" xml:space="preserve"><tspan fill="#c084fc">    if </tspan><tspan fill="#e2e8f0">percentage &gt;= minimum:</tspan></text>
<text x="640" y="132" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" xml:space="preserve"><tspan fill="#c084fc">        return </tspan><tspan fill="#e2e8f0">grade</tspan></text>
<text x="640" y="153" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" xml:space="preserve"><tspan fill="#e2e8f0">passed = </tspan><tspan fill="#60a5fa">all</tspan><tspan fill="#e2e8f0">(m &gt;= PASS_MARK </tspan><tspan fill="#c084fc">for </tspan><tspan fill="#e2e8f0">m </tspan><tspan fill="#c084fc">in </tspan><tspan fill="#e2e8f0">marks)</tspan></text>
<text x="640" y="174" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" xml:space="preserve"><tspan fill="#e2e8f0">highest = </tspan><tspan fill="#60a5fa">max</tspan><tspan fill="#e2e8f0">(student_marks)</tspan></text>
<text x="640" y="195" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="12" xml:space="preserve"><tspan fill="#e2e8f0">lowest = </tspan><tspan fill="#60a5fa">min</tspan><tspan fill="#e2e8f0">(student_marks)</tspan></text>
